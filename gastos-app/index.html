<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculadora de Gastos</title>
    <!-- Rutas actualizadas apuntando a la carpeta src -->
    <link rel="stylesheet" href="./src/style.css">
  </head>
  <body>
    <div id="app">
      <h1>💰 Dividir Cuenta</h1>
      <label>Total de la cuenta ($):</label>
      <input type="number" id="total" placeholder="Ej. 50000">
      
      <label>Número de personas:</label>
      <input type="number" id="personas" placeholder="Ej. 4">
      
      <button id="calcular">Calcular</button>
      
      <h2 id="resultado"></h2>
    </div>
    <!-- Rutas actualizadas apuntando a la carpeta src -->
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
